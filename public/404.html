<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Lost in the Starlight | SHREE'S JOURNEY</title>
  <meta name="theme-color" content="#0B0B0F" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Typography -->
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,600,700,800&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0B0B0F;
      color: #f0f0f5;
      font-family: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 10;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background: rgba(12, 13, 18, 0.85);
      border: 1px solid rgba(229, 193, 88, 0.35);
      border-radius: 32px;
      padding: 48px 32px;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.9), 0 0 50px rgba(229, 193, 88, 0.15);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(229, 193, 88, 0.12);
      border: 1px solid rgba(229, 193, 88, 0.4);
      color: #e5c158;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      padding: 6px 16px;
      border-radius: 999px;
    }
    .errorCode {
      font-family: 'Cinzel', serif;
      font-size: clamp(64px, 14vw, 100px);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 0%, #f7e6a7 50%, #e5c158 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(229, 193, 88, 0.4));
      letter-spacing: 2px;
    }
    .title {
      font-size: clamp(20px, 4vw, 26px);
      font-weight: 800;
      color: #f0f0f5;
      letter-spacing: -0.5px;
    }
    .quote {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 16px;
      color: rgba(240, 240, 245, 0.75);
      line-height: 1.6;
    }
    .button {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 36px;
      border-radius: 999px;
      background: linear-gradient(135deg, #e5c158 0%, #ffd700 50%, #b89530 100%);
      color: #0c0d12;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      text-decoration: none;
      box-shadow: 0 0 35px rgba(229, 193, 88, 0.5), 0 4px 15px rgba(0, 0, 0, 0.5);
      border: 1px solid #ffffff;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }
    .button:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 50px rgba(229, 193, 88, 0.8), 0 6px 20px rgba(0, 0, 0, 0.6);
    }
    .button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <canvas id="starCanvas"></canvas>

  <main class="container">
    <div class="badge">✦ Memory Uncharted ✦</div>
    <div class="errorCode">404</div>
    <h1 class="title">Lost in the Starlight</h1>
    <p class="quote">
      “The memory you are looking for has drifted into the cosmos, but the journey of five million voices continues.”
    </p>
    <a href="/" class="button">
      <span>Return to Shree’s Journey</span>
      <span>🌸</span>
    </a>
  </main>

  <script>
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = Array.from({ length: 45 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2 + 0.8,
      speedY: -Math.random() * 0.4 - 0.1,
      speedX: (Math.random() - 0.5) * 0.2,
      alpha: Math.random() * 0.7 + 0.2,
    }));

    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y < 0) {
          p.y = height;
          p.x = Math.random() * width;
        }
        ctx.fillStyle = 'rgba(229, 193, 88, ' + p.alpha + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
